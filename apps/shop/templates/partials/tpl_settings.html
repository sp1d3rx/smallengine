<!-- ── Settings ─────────────────────────────────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-settings">
<section class="page">
  <h1>Settings</h1>

  <h2>Shop Information</h2>
  <form id="form-shop-settings">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
      <div class="field"><label>Shop Name</label>
        <input type="text" name="shop_name" value="{{shop_name}}" /></div>
      <div class="field"><label>Phone</label>
        <input type="text" name="phone" value="{{phone}}" /></div>
      <div class="field"><label>Email</label>
        <input type="email" name="email" value="{{email}}" /></div>
      <div class="field"><label>Address</label>
        <input type="text" name="address" value="{{address}}" /></div>
      <div class="field"><label>City</label>
        <input type="text" name="city" value="{{city}}" /></div>
      <div class="field"><label>ZIP</label>
        <input type="text" name="zip_code" value="{{zip_code}}" /></div>
      <div class="field"><label>Sales Tax Rate</label>
        <input type="number" name="tax_rate" step="0.0001" value="{{tax_rate}}" /></div>
      <div class="field"><label>Default Labor Rate ($/hr)</label>
        <input type="number" name="default_labor_rate" step="0.01" value="{{default_labor_rate}}" /></div>
      <div class="field"><label>Estimate Approval Threshold ($)</label>
        <input type="number" name="estimate_approval_threshold" step="0.01" value="{{estimate_approval_threshold}}" /></div>
      <div class="field" style="grid-column:1/-1"><label>Intake Document Service Disclaimer &amp; Authorization Terms</label>
        <textarea name="intake_disclaimer" rows="6" style="width:100%;font-family:inherit;font-size:.85rem;line-height:1.4">{{intake_disclaimer}}</textarea>
        <span class="muted" style="display:block;margin-top:.25rem">Appears on printable customer intake agreements above the signature line. Supports multiple paragraphs.</span>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>

  <h2 style="margin-top:2rem">Users</h2>
  <div class="page-header" style="margin-bottom:.75rem">
    <span></span>
    <button class="btn btn-primary" id="btn-new-user">+ New User</button>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
    <tbody>
      {{#each users}}
      <tr>
        <td>{{name}}</td>
        <td>{{email}}</td>
        <td><span class="badge {{badge_cls}}">{{role}}</span></td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="editUser({{id}})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser({{id}})">Delete</button>
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</section>
</script>

<!-- ── User add/edit form (modal body) ──────────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-user-form">
<form id="form-user">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
    <div class="field"><label>First Name</label>
      <input type="text" name="first_name" value="{{first_name}}" required /></div>
    <div class="field"><label>Last Name</label>
      <input type="text" name="last_name" value="{{last_name}}" required /></div>
    <div class="field"><label>Email</label>
      <input type="email" name="email" value="{{email}}" required /></div>
    <div class="field"><label>Password{{#if is_edit}} (leave blank to keep){{/if}}</label>
      <input type="password" name="password"{{#unless is_edit}} required{{/unless}} /></div>
  </div>
  <div class="field">
    <label>Role</label>
    <select name="role">
      {{#each roles}}
      <option value="{{value}}"{{#if is_selected}} selected{{/if}}>{{label}}</option>
      {{/each}}
    </select>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" id="btn-cancel-user">Cancel</button>
    <button type="submit" class="btn btn-primary">{{action_label}}</button>
  </div>
</form>
</script>
