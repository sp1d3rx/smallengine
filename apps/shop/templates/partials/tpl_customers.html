<!-- ── Customers split-panel shell + subviews ─────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-customers-shell">
<section class="page customer-page">
  
  <div class="page-header" style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h1>Customer Hub</h1>
    </div>
    <div class="quick-links" style="margin-top: 0; margin-bottom: 0;">
      <button class="btn btn-sm {{#if (eq active_subview 'registry')}}btn-primary{{else}}btn-ghost{{/if}}" id="btn-cust-registry-tab">Customer Registry</button>
      <button class="btn btn-sm {{#if (eq active_subview 'retention')}}btn-primary{{else}}btn-ghost{{/if}}" id="btn-cust-retention-tab">Retention &amp; CRM Dashboard</button>
    </div>
  </div>

  <!-- Registry View -->
  {{#if (eq active_subview 'registry')}}
  <div class="customer-registry" style="display: grid; grid-template-columns: 340px 1fr; gap: 1rem; height: calc(100vh - 180px); align-items: stretch;">
    <!-- Left panel: search + list -->
    <div class="cust-list-panel" style="background: var(--card-background); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; height: 100%; overflow: hidden;">
      <div class="cust-list-header" style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="margin:0; font-size:1.1rem;">Search Registry</h3>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-new-customer">+ Add Customer</button>
      </div>
      <div class="cust-search-bar" style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color);">
        <input id="customer-search" type="search" placeholder="Search name, phone, or email…" autocomplete="off" style="width:100%;" />
      </div>
      <div class="cust-col-header" style="padding: 0.5rem 1rem; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); background: var(--border-color);">
        <span>Customer</span>
        <span>Type</span>
      </div>
      <div class="cust-list-scroll" id="customer-list-items" style="flex: 1; overflow-y: auto; padding: 0.5rem 0;">
        <p class="empty cust-empty-hint" style="padding: 2rem 1rem; text-align: center; color: var(--text-muted);">Type to search customers.</p>
      </div>
      <div id="new-customer-footer" style="display:none; padding: 1rem; border-top: 1px solid var(--border-color); background: var(--border-color);" class="cust-list-footer">
        <p class="muted" style="font-size:0.8rem; margin-bottom: 0.5rem;">Not seeing them?</p>
        <button class="btn btn-primary btn-sm" id="btn-new-customer-2" style="width:100%; justify-content:center;">+ New Customer</button>
      </div>
    </div>

    <!-- Right panel: detail (empty until a customer is selected) -->
    <div class="cust-detail-panel" id="cust-detail-panel" style="background: var(--card-background); border: 1px solid var(--border-color); border-radius: 8px; height: 100%; overflow: hidden; display: flex; flex-direction: column;">
      <div class="cust-detail-empty" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
        <p>Select a customer to view details.</p>
      </div>
    </div>
  </div>
  {{/if}}

  <!-- Retention & CRM Dashboard View -->
  {{#if (eq active_subview 'retention')}}
  <div class="bench-card">
    <h3>Customer Retention &amp; Value Dashboard</h3>
    <p class="muted" style="margin-bottom:1.5rem;">Displays CRM metrics to assist with scheduling check-ups, marketing outreach, and contact logs. <small class="text-success">Sorted by Total Spent descending.</small></p>
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Phone</th>
          <th>Email</th>
          <th class="num">Visits</th>
          <th class="num">Avg. Ticket</th>
          <th class="num">Total Revenue</th>
          <th>Last Service Visit</th>
          <th>Last CRM Contact</th>
          <th>Retention Status</th>
        </tr>
      </thead>
      <tbody>
        {{#each retention_customers}}
        <tr>
          <td><strong><a href="#/customers/{{id}}" class="lnk-retention-customer" data-id="{{id}}">{{name}}</a></strong></td>
          <td>{{phone}}</td>
          <td>{{email}}</td>
          <td class="num">{{visit_count}}</td>
          <td class="num">${{avg_ticket_fmt}}</td>
          <td class="num" style="font-weight:bold;color:var(--primary);">${{total_spent_fmt}}</td>
          <td>{{last_visit}} <small class="muted">({{days_since_label}})</small></td>
          <td>{{last_contact}}</td>
          <td><span class="badge badge-{{status_class}}">{{status}}</span></td>
        </tr>
        {{else}}
        <tr><td colspan="9" class="empty">No customer purchase data available.</td></tr>
        {{/each}}
      </tbody>
    </table>
  </div>
  {{/if}}

</section>
</script>


<!-- ── Customers: list items (left panel) ───────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-customers-list-items">
{{#each customers}}
<div class="cust-list-item{{#if is_selected}} selected{{/if}}" data-id="{{id}}" style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;">
  <div class="cust-identity" style="display: flex; align-items: center; gap: 0.75rem;">
    <div class="cust-avatar-sm" style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem;">{{initials}}</div>
    <div>
      <div class="cust-item-name" style="font-weight: bold; color: var(--text-color);">{{name}}</div>
      <div class="cust-item-sub" style="font-size: 0.8rem; color: var(--text-muted);">{{contact_val}}</div>
    </div>
  </div>
  <div class="cust-item-type" style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">{{customer_type}}</div>
</div>
{{else}}
<p class="empty cust-empty-hint" style="padding: 2rem 1rem; text-align: center; color: var(--text-muted);">{{empty_msg}}</p>
{{/each}}
</script>


<!-- ── Customers: detail panel (right side) ─────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-customers-detail-panel">
<div class="cust-detail-scroll" style="flex: 1; overflow-y: auto; padding: 1.5rem;">

  <!-- Header: avatar + action buttons -->
  <div class="cust-detail-top" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <div class="cust-avatar-lg" style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem;">{{initials}}</div>
    <div class="cust-detail-action-btns" style="display: flex; gap: 0.5rem;">
      <button class="btn btn-ghost btn-sm" id="btn-edit-customer">Edit Customer Info</button>
      <button class="btn btn-ghost btn-sm" id="btn-add-equipment">+ Add Equipment</button>
    </div>
  </div>

  <!-- Name + contact -->
  <div class="cust-detail-name" style="margin-bottom: 2rem;">
    <h2 style="margin: 0 0 0.5rem 0; font-size: 1.75rem; color: var(--text-color);">{{first_name}} {{last_name}}</h2>
    <div class="cust-detail-contacts" style="display: flex; gap: 1rem; font-size: 0.9rem; color: var(--text-muted);">
      {{#if phone}}<span>📞 {{phone}}</span>{{/if}}
      {{#if email}}<span>✉️ {{email}}</span>{{/if}}
    </div>
    {{#if customer_type_is_commercial}}
    <div class="cust-type-tag" style="display: inline-block; margin-top: 0.5rem; background: #e0f2fe; color: #0369a1; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">Commercial</div>
    {{/if}}
    {{#if notes}}<p class="cust-detail-notes" style="margin-top: 1rem; padding: 0.75rem; background: var(--border-color); border-radius: 4px; font-size: 0.9rem; line-height: 1.4;">{{notes}}</p>{{/if}}
  </div>

  <!-- Registered Equipment -->
  <div class="cust-detail-section" style="margin-bottom: 2rem;">
    <div class="cust-section-label" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem;">Registered Equipment</div>
    {{#each equipment}}
    <div class="cust-equip-card" id="equip-{{id}}" style="padding: 1rem; border: 1px solid var(--border-color); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; background: var(--body-background); margin-bottom: 0.75rem;">
      <div>
        <div class="cust-equip-name" style="font-weight: bold; font-size: 1rem; color: var(--text-color);">{{year_make_model}}</div>
        <div class="cust-equip-serial" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">S/N: {{serial_number}}</div>
      </div>
      <div class="cust-equip-actions" style="display: flex; gap: 0.5rem;">
        <a href="#/workorders/new?customer_id={{../customer_id}}&equipment_id={{id}}" class="btn btn-primary btn-sm">New WO</a>
        <button class="btn btn-ghost btn-sm" id="btn-edit-equip-{{id}}">Edit</button>
      </div>
    </div>
    {{else}}
    <p class="empty" style="text-align: center; color: var(--text-muted); padding: 1rem 0;">No equipment on file.</p>
    {{/each}}
  </div>

  <!-- Contact & CRM Interaction Log -->
  <div class="cust-detail-section" style="margin-bottom: 2rem;">
    <div class="cust-section-label" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
      <span>CRM Contact &amp; Interaction Log</span>
      <button class="btn btn-ghost btn-sm" id="btn-add-contact" style="padding:0.2rem 0.5rem; font-size:0.75rem;">+ Log Contact</button>
    </div>
    {{#if contact_logs}}
    <div class="cust-wo-timeline" style="position: relative; padding-left: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;">
      {{#each contact_logs}}
      <div class="cust-wo-item" style="position: relative;">
        <div class="cust-wo-dot" style="position: absolute; left: -1.75rem; top: 0.25rem; width: 10px; height: 10px; border-radius: 50%; background-color: var(--primary);"></div>
        <div class="cust-wo-body">
          <div class="cust-wo-title" style="font-weight: bold; font-size: 0.95rem;">
            <span style="text-transform: capitalize; color:var(--text-color);">{{contact_type}}</span> <span class="muted" style="font-weight:normal; font-size:0.8rem; color:var(--text-muted);">logged by {{logged_by}}</span>
          </div>
          <div class="cust-wo-meta" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem;">
            <span>{{contact_date}}</span>
          </div>
          <div class="cust-wo-problem" style="margin-top: 0.35rem; font-style: normal; color: var(--text-color); font-size: 0.9rem; line-height: 1.4;">
            {{notes}}
          </div>
        </div>
      </div>
      {{/each}}
    </div>
    {{else}}
    <p class="empty" style="text-align: center; color: var(--text-muted); padding: 1rem 0;">No interaction history logged.</p>
    {{/if}}
  </div>

  <!-- Work Order History -->
  <div class="cust-detail-section" style="margin-bottom: 2rem;">
    <div class="cust-section-label" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem;">Work Order History</div>
    {{#if work_orders}}
    <div class="cust-wo-timeline" style="position: relative; padding-left: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;">
      {{#each work_orders}}
      <div class="cust-wo-item" style="position: relative;">
        <div class="cust-wo-dot{{#if is_active}} active{{/if}}" style="position: absolute; left: -1.75rem; top: 0.25rem; width: 10px; height: 10px; border-radius: 50%; background-color: var(--text-muted);"></div>
        <div class="cust-wo-body">
          <div class="cust-wo-title" style="font-weight: bold; font-size: 0.95rem;">
            <a href="#/workorders/{{id}}">Work Order #{{id}}</a>
            {{#if equip_label}}<span class="muted" style="font-weight:normal; font-size:0.85rem;">— {{equip_label}}</span>{{/if}}
          </div>
          <div class="cust-wo-meta" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; display: flex; gap: 0.5rem; align-items: center;">
            <span class="badge badge-{{status}}">{{status_label}}</span>
            <span>Intake: {{date_in}}</span>
          </div>
          {{#if problem_preview}}
          <div class="cust-wo-problem" style="margin-top: 0.35rem; font-style: italic; color: var(--text-muted); font-size: 0.85rem; line-height: 1.4;">{{problem_preview}}</div>
          {{/if}}
        </div>
      </div>
      {{/each}}
    </div>
    {{else}}
    <p class="empty" style="text-align: center; color: var(--text-muted); padding: 1rem 0;">No work order history.</p>
    {{/if}}
  </div>

  <!-- Retail Sales -->
  {{#if retail_sales}}
  <div class="cust-detail-section" style="margin-bottom: 2rem;">
    <div class="cust-section-label" style="font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem;">Retail Sales</div>
    <div class="cust-wo-timeline" style="position: relative; padding-left: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;">
      {{#each retail_sales}}
      <div class="cust-wo-item" style="position: relative;">
        <div class="cust-wo-dot" style="position: absolute; left: -1.75rem; top: 0.25rem; width: 10px; height: 10px; border-radius: 50%; background-color: var(--text-muted);"></div>
        <div class="cust-wo-body">
          <div class="cust-wo-title" style="font-weight: bold; font-size: 0.95rem;">
            <a href="#/retail/{{id}}">Sale #{{id}} — {{total_fmt}}</a>
          </div>
          <div class="cust-wo-meta" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; display: flex; gap: 0.5rem; align-items: center;">
            <span class="badge badge-{{status}}">{{status}}</span>
            <span>Date: {{sale_date}}</span>
          </div>
        </div>
      </div>
      {{/each}}
    </div>
  </div>
  {{/if}}

</div><!-- /.cust-detail-scroll -->

<div class="cust-detail-footer" style="padding: 1rem; border-top: 1px solid var(--border-color); background: var(--border-color);">
  <a href="#/workorders/new?customer_id={{customer_id}}" class="btn btn-primary" style="width:100%; justify-content:center;">
    Create New Service Order
  </a>
</div>
</script>


<!-- ── Customer add/edit form (modal body) ───────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-customer-form">
<form id="form-customer">
  <div class="form-grid-2">
    <div class="field"><label>First Name *</label>
      <input type="text" name="first_name" value="{{first_name}}" required /></div>
    <div class="field"><label>Last Name *</label>
      <input type="text" name="last_name" value="{{last_name}}" required /></div>
    <div class="field"><label>Phone</label>
      <input type="tel" name="phone" value="{{phone}}" /></div>
    <div class="field"><label>Email</label>
      <input type="email" name="email" value="{{email}}" /></div>
    <div class="field"><label>Preferred Contact</label>
      <select name="contact_preference">
        <option value="call" {{#if (eq contact_preference "call")}}selected{{/if}}>Phone Call</option>
        <option value="sms" {{#if (eq contact_preference "sms")}}selected{{/if}}>SMS / Text</option>
        <option value="email" {{#if (eq contact_preference "email")}}selected{{/if}}>Email</option>
      </select></div>
    <div class="field"><label>Customer Type</label>
      <select name="customer_type">
        <option value="residential" {{#if (eq customer_type "residential")}}selected{{/if}}>Residential</option>
        <option value="commercial" {{#if (eq customer_type "commercial")}}selected{{/if}}>Commercial</option>
      </select></div>
    <div class="field"><label>Address</label>
      <input type="text" name="address" value="{{address}}" /></div>
    <div class="field"><label>City</label>
      <input type="text" name="city" value="{{city}}" /></div>
    <div class="field"><label>State</label>
      <input type="text" name="state" value="{{state}}" /></div>
    <div class="field"><label>ZIP</label>
      <input type="text" name="zip_code" value="{{zip_code}}" /></div>
    <div class="field" style="grid-column:1/-1"><label>Notes</label>
      <textarea name="notes" rows="2">{{notes}}</textarea></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" id="btn-cancel-customer">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
</script>


<!-- ── Equipment add/edit form (modal body) ──────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-equipment-form">
<form id="form-equipment">
  <div class="form-grid-2">
    <div class="field"><label>Category *</label>
      <select name="category">
        {{#each categories}}
        <option value="{{value}}"{{#if is_selected}} selected{{/if}}>{{label}}</option>
        {{/each}}
      </select></div>
    <div class="field"><label>Make</label>
      <input type="text" name="make" value="{{make}}" /></div>
    <div class="field"><label>Model</label>
      <input type="text" name="model" value="{{model}}" /></div>
    <div class="field"><label>Serial Number</label>
      <input type="text" name="serial_number" value="{{serial_number}}" /></div>
    <div class="field"><label>Year</label>
      <input type="number" name="year" value="{{year}}" min="1950" max="2030" /></div>
    <div class="field"><label>Notes</label>
      <input type="text" name="notes" value="{{notes}}" /></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" id="btn-cancel-equip">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
</script>


<!-- ── Log Customer Contact Form (modal body) ────────────────────────────────── -->
<script type="text/x-handlebars-template" id="tpl-contact-form">
<form id="form-contact-log">
  <div class="form-grid-2">
    <div class="field"><label>Contact Date *</label>
      <input type="date" name="contact_date" value="{{today}}" required /></div>
    <div class="field"><label>Contact Type *</label>
      <select name="contact_type">
        <option value="call">Phone Call</option>
        <option value="email">Email</option>
        <option value="sms">SMS / Text</option>
        <option value="in_person">In Person</option>
      </select></div>
    <div class="field" style="grid-column:1/-1"><label>Discussion Notes *</label>
      <textarea name="notes" rows="4" placeholder="What did you discuss with the customer?..." required></textarea></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" id="btn-cancel-contact">Cancel</button>
    <button type="submit" class="btn btn-primary">Log Interaction</button>
  </div>
</form>
</script>
